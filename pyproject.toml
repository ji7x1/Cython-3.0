[build-system]
requires = ["setuptools>=64", "Cython>=3.0,<3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmath"
version = "0.1.0"
description = "Small fast numeric helpers written in Cython 3.0"
requires-python = ">=3.8"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
